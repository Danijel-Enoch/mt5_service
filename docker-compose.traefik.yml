services:
  traefik:
    image: traefik:3.0
    container_name: traefik
    ports:
      - 9080:80
      - 9443:443
    restart: always
    labels:
      traefik.enable: true
      traefik.docker.network: traefik-public
      traefik.http.services.traefik-dashboard.loadbalancer.server.port: 8080
      traefik.http.routers.traefik-dashboard-http.entrypoints: http
      traefik.http.routers.traefik-dashboard-http.rule: Host(`${TRAEFIK_DOMAIN?Variable not set}`)
      traefik.http.routers.traefik-dashboard-https.entrypoints: https
      traefik.http.routers.traefik-dashboard-https.rule: Host(`${TRAEFIK_DOMAIN?Variable not set}`)
      traefik.http.routers.traefik-dashboard-https.tls: true
      traefik.http.routers.traefik-dashboard-https.tls.certresolver: le
      traefik.http.routers.traefik-dashboard-https.service: api@internal
      traefik.http.middlewares.https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.https-redirect.redirectscheme.permanent: true
      traefik.http.routers.traefik-dashboard-http.middlewares: https-redirect
      traefik.http.middlewares.admin-auth.basicauth.users: ${TRAEFIK_USERNAME?Variable not set}:${TRAEFIK_HASHED_PASSWORD?Variable not set}
      traefik.http.routers.traefik-dashboard-https.middlewares: admin-auth
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-public-certificates:/certificates
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL?Variable not set}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=http
      - --accesslog
      - --log
      - --api
    networks:
      - traefik-public

  mt5-gateway:
    networks:
      - traefik-public
      - mt5-net
    labels:
      traefik.enable: true
      traefik.docker.network: traefik-public
      traefik.http.routers.api-mt5-http.rule: Host(`${API_DOMAIN?Variable not set}`)
      traefik.http.routers.api-mt5-http.entrypoints: http
      traefik.http.routers.api-mt5-http.middlewares: https-redirect
      traefik.http.routers.api-mt5-http.service: api-mt5-service
      traefik.http.routers.api-mt5-https.rule: Host(`${API_DOMAIN?Variable not set}`)
      traefik.http.routers.api-mt5-https.entrypoints: https
      traefik.http.routers.api-mt5-https.tls: true
      traefik.http.routers.api-mt5-https.tls.certresolver: le
      traefik.http.routers.api-mt5-https.service: api-mt5-service
      traefik.http.services.api-mt5-service.loadbalancer.server.port: 5001

  mt5-worker-1:
    networks:
      - traefik-public
      - mt5-net
    labels:
      traefik.enable: true
      traefik.docker.network: traefik-public
      traefik.http.routers.vnc-worker1-http.rule: Host(`w1.${VNC_BASE_DOMAIN?Variable not set}`)
      traefik.http.routers.vnc-worker1-http.entrypoints: http
      traefik.http.routers.vnc-worker1-http.middlewares: https-redirect
      traefik.http.routers.vnc-worker1-http.service: vnc-worker1-service
      traefik.http.routers.vnc-worker1-https.rule: Host(`w1.${VNC_BASE_DOMAIN?Variable not set}`)
      traefik.http.routers.vnc-worker1-https.entrypoints: https
      traefik.http.routers.vnc-worker1-https.tls: true
      traefik.http.routers.vnc-worker1-https.tls.certresolver: le
      traefik.http.routers.vnc-worker1-https.service: vnc-worker1-service
      traefik.http.services.vnc-worker1-service.loadbalancer.server.port: 3000

  mt5-worker-2:
    networks:
      - traefik-public
      - mt5-net
    labels:
      traefik.enable: true
      traefik.docker.network: traefik-public
      traefik.http.routers.vnc-worker2-http.rule: Host(`w2.${VNC_BASE_DOMAIN?Variable not set}`)
      traefik.http.routers.vnc-worker2-http.entrypoints: http
      traefik.http.routers.vnc-worker2-http.middlewares: https-redirect
      traefik.http.routers.vnc-worker2-http.service: vnc-worker2-service
      traefik.http.routers.vnc-worker2-https.rule: Host(`w2.${VNC_BASE_DOMAIN?Variable not set}`)
      traefik.http.routers.vnc-worker2-https.entrypoints: https
      traefik.http.routers.vnc-worker2-https.tls: true
      traefik.http.routers.vnc-worker2-https.tls.certresolver: le
      traefik.http.routers.vnc-worker2-https.service: vnc-worker2-service
      traefik.http.services.vnc-worker2-service.loadbalancer.server.port: 3000

volumes:
  traefik-public-certificates:

networks:
  mt5-net:
    driver: bridge
  traefik-public:
    external: true
